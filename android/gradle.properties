# Sized for an 8 GB PC: larger values make Windows kill the Gradle daemon
# ("daemon disappeared unexpectedly") during release builds.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+UseParallelGC -Dfile.encoding=UTF-8
# Compile Kotlin inside the Gradle process instead of a second big JVM.
kotlin.compiler.execution.strategy=in-process
# Few workers at a time keeps peak memory low.
org.gradle.workers.max=2
org.gradle.parallel=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin incremental caches break when the project (D:) and pub cache (C:)
# are on different drives on Windows.
kotlin.incremental=false
